<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Todo Delivery - Seguimiento en Vivo</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet CSS & JS (Mapas ligeros) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Invertir colores de mapa OSM para efecto Dark Mode nativo sin coste */
    .dark-tiles .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
    }

    /* Ocultar atribución visual excesiva en pantallas móviles compactas */
    .leaflet-control-attribution {
      font-size: 8px !important;
      background: rgba(15, 23, 42, 0.7) !important;
      color: #64748b !important;
    }
    .leaflet-control-attribution a {
      color: #94a3b8 !important;
    }

    /* Animación de pulso para el cadete */
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .driver-pulse {
      animation: pulse-ring 2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col justify-between select-none relative">

  <!-- ================= 1. CABECERA FLOTANTE ================= -->
  <header class="absolute top-3 inset-x-3 z-[1000] max-w-md mx-auto">
    <div class="bg-slate-900/90 border border-slate-800/90 backdrop-blur-md rounded-2xl px-4 py-3 flex items-center justify-between shadow-xl">
      
      <button onclick="window.history.back()" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700/80 flex items-center justify-center text-slate-300 active:bg-slate-700 transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
      </button>

      <div class="text-center">
        <div class="flex items-center justify-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <h1 class="text-xs font-bold text-white tracking-wide">Pedido #2492 en curso</h1>
        </div>
        <p class="text-[11px] font-mono text-amber-400 font-medium">Llegada estimada: 12 min</p>
      </div>

      <button class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700/80 flex items-center justify-center text-slate-300 active:bg-slate-700 transition-colors">
        <i data-lucide="shield-alert" class="w-4 h-4 text-amber-400"></i>
      </button>

    </div>
  </header>

  <!-- ================= 2. CONTENEDOR DEL MAPA EN VIVO ================= -->
  <div id="map" class="w-full h-full z-0 dark-tiles"></div>

  <!-- Botón flotante para recentrar mapa -->
  <button onclick="recenterMap()" class="absolute right-4 bottom-[310px] z-[1000] w-11 h-11 rounded-full bg-slate-900/95 border border-slate-700 shadow-xl flex items-center justify-center text-slate-200 active:scale-95 transition-transform">
    <i data-lucide="crosshair" class="w-5 h-5 text-amber-400"></i>
  </button>

  <!-- ================= 3. TARJETA INFERIOR (BOTTOM SHEET) ================= -->
  <section class="absolute bottom-0 inset-x-0 z-[1000] max-w-md mx-auto p-3">
    <div class="bg-slate-900/95 border border-slate-800 backdrop-blur-md rounded-3xl p-4 shadow-2xl space-y-4">
      
      <!-- Tirador visual superior -->
      <div class="w-10 h-1 bg-slate-700 rounded-full mx-auto -mt-1"></div>

      <!-- Estado y Barra de Progreso del Pedido -->
      <div class="space-y-2">
        <div class="flex justify-between items-center text-xs">
          <span class="font-bold text-white flex items-center gap-1.5">
            <i data-lucide="truck" class="w-4 h-4 text-amber-400"></i>
            En camino al destino
          </span>
          <span class="font-mono text-slate-400 text-[11px]">800 m restantes</span>
        </div>

        <!-- Barra de Progreso Multi-Etapa -->
        <div class="grid grid-cols-4 gap-1.5 pt-1">
          <div class="h-1.5 rounded-full bg-emerald-500"></div>
          <div class="h-1.5 rounded-full bg-emerald-500"></div>
          <div class="h-1.5 rounded-full bg-amber-500 animate-pulse"></div>
          <div class="h-1.5 rounded-full bg-slate-800"></div>
        </div>
        <div class="flex justify-between text-[10px] text-slate-400 font-medium px-0.5">
          <span class="text-slate-300">Confirmado</span>
          <span class="text-slate-300">Retirado</span>
          <span class="text-amber-400 font-bold">En viaje</span>
          <span>Entregado</span>
        </div>
      </div>

      <!-- Tarjeta del Cadete Asignado -->
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          
          <!-- Avatar del Cadete -->
          <div class="relative w-11 h-11 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center shrink-0">
            <i data-lucide="user" class="w-5 h-5 text-slate-300"></i>
            <span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-emerald-500 border-2 border-slate-950 flex items-center justify-center text-[8px] font-bold text-slate-950">✓</span>
          </div>

          <!-- Info Cadete -->
          <div>
            <div class="flex items-center gap-1.5">
              <h3 class="text-xs font-bold text-white">Martín Gómez</h3>
              <div class="flex items-center text-[10px] text-amber-400 font-bold">
                <i data-lucide="star" class="w-3 h-3 fill-amber-400 mr-0.5"></i> 4.9
              </div>
            </div>
            <p class="text-[11px] text-slate-400">Honda Wave 110 • <strong class="text-slate-200">A123BCD</strong></p>
          </div>
        </div>

        <!-- Acciones: Chat y Llamada -->
        <div class="flex items-center gap-2">
          <button class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 active:bg-slate-800 transition-colors">
            <i data-lucide="phone" class="w-4 h-4 text-emerald-400"></i>
          </button>
          <button class="w-9 h-9 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-bold active:bg-amber-600 transition-colors shadow-sm">
            <i data-lucide="message-square" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Detalle rápido de ruta -->
      <div class="flex items-center justify-between text-[11px] text-slate-400 px-1">
        <div class="truncate max-w-[240px]">
          <span class="text-slate-500">Entrega en:</span> <strong class="text-slate-300">Calle Mendoza 350 Sur</strong>
        </div>
        <button class="text-amber-400 font-semibold hover:underline">Ver detalle</button>
      </div>

    </div>
  </section>

  <!-- ================= 4. LÓGICA DEL MAPA Y GEOLOCALIZACIÓN ================= -->
  <script>
    lucide.createIcons();

    // Coordenadas simuladas (Villa Krause / San Juan)
    const originCoords = [-31.5710, -68.5320];     // Punto A: Retiro
    let driverCoords = [-31.5650, -68.5280];       // Cadete en camino
    const destinationCoords = [-31.5580, -68.5220]; // Punto B: Destino

    // 1. Inicializar mapa
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: true
    }).setView(driverCoords, 14);

    // 2. Cargar capa de teselas (Tiles OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 3. Iconos personalizados SVG ultra-livianos
    const createCustomIcon = (iconHtml) => {
      return L.divIcon({
        html: iconHtml,
        className: '',
        iconSize: [36, 36],
        iconAnchor: [18, 18]
      });
    };

    const originIcon = createCustomIcon(`
      <div class="w-7 h-7 rounded-full bg-slate-900 border-2 border-emerald-400 flex items-center justify-center shadow-lg">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400"></div>
      </div>
    `);

    const destIcon = createCustomIcon(`
      <div class="w-7 h-7 rounded-full bg-slate-900 border-2 border-amber-400 flex items-center justify-center shadow-lg">
        <div class="w-2.5 h-2.5 rounded-full bg-amber-400"></div>
      </div>
    `);

    const driverIcon = createCustomIcon(`
      <div class="relative flex items-center justify-center w-9 h-9">
        <div class="absolute inset-0 rounded-full bg-amber-400 driver-pulse"></div>
        <div class="relative w-8 h-8 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center shadow-xl border-2 border-slate-950">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
        </div>
      </div>
    `);

    // 4. Marcadores en el mapa
    L.marker(originCoords, { icon: originIcon }).addTo(map);
    L.marker(destinationCoords, { icon: destIcon }).addTo(map);
    const driverMarker = L.marker(driverCoords, { icon: driverIcon }).addTo(map);

    // 5. Dibujar ruta del trayecto
    const routeLine = L.polyline([originCoords, driverCoords, destinationCoords], {
      color: '#f59e0b',
      weight: 3.5,
      opacity: 0.8,
      dashArray: '6, 8'
    }).addTo(map);

    // Función de recentrado
    function recenterMap() {
      map.flyTo(driverCoords, 15, { duration: 0.8 });
    }

    // Simulación de avance del cadete hacia el destino (WebSockets en producción)
    setInterval(() => {
      driverCoords[0] += (destinationCoords[0] - driverCoords[0]) * 0.04;
      driverCoords[1] += (destinationCoords[1] - driverCoords[1]) * 0.04;

      driverMarker.setLatLng(driverCoords);
      routeLine.setLatLngs([originCoords, driverCoords, destinationCoords]);
    }, 2500);
  </script>
</body>
</html>
