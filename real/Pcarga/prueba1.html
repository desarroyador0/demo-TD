<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Delivery - Splash Screen</title>
  
  <!-- Tailwind CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background-color: #020617; /* bg-slate-950 */
      color: #f8fafc;
      overflow: hidden;
    }

    /* ================= GLASSMORPHISM & CUSTOM COLORS ================= */
    .bg-slate-950 {
      background-color: #020617;
    }
    
    .glass-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .glass-badge {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .glass-bar {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ================= KEYFRAME ANIMATIONS ================= */
    
    /* Orb 1 animation */
    @keyframes orb1-move {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(40px, -50px) scale(1.2); }
      66% { transform: translate(-30px, 20px) scale(0.9); }
    }
    .animate-orb1 {
      animation: orb1-move 9s infinite ease-in-out;
    }

    /* Orb 2 animation */
    @keyframes orb2-move {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(-50px, 40px) scale(1.15); }
      66% { transform: translate(30px, -40px) scale(0.85); }
    }
    .animate-orb2 {
      animation: orb2-move 8s infinite ease-in-out;
    }

    /* Orb 3 animation */
    @keyframes orb3-move {
      0%, 100% { transform: translate(0px, 0px) scale(0.9); }
      33% { transform: translate(30px, 30px) scale(1.15); }
      66% { transform: translate(-40px, -20px) scale(1); }
    }
    .animate-orb3 {
      animation: orb3-move 11s infinite ease-in-out;
    }

    /* Header Entry Fade In */
    @keyframes header-in {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-header-in {
      animation: header-in 0.6s ease-out forwards;
    }

    /* Card Entry Zoom In */
    @keyframes card-in {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-card-in {
      animation: card-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Brand Name Entry Fade In */
    @keyframes brand-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-brand-in {
      animation: brand-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      opacity: 0; /* Keep hidden before animation starts */
    }

    /* Truck bounce */
    @keyframes truck-bounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(-1deg); }
      75% { transform: translateY(-2px) rotate(1deg); }
    }
    .animate-truck {
      animation: truck-bounce 2.2s infinite ease-in-out;
    }

    /* Floating package */
    @keyframes package-float {
      0%, 100% { transform: translate(0px, 0px) rotate(5deg); }
      50% { transform: translate(4px, -6px) rotate(15deg); }
    }
    .animate-package {
      animation: package-float 2.8s infinite ease-in-out;
    }

    /* Pin pulse */
    @keyframes pin-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .animate-pin {
      animation: pin-pulse 1.5s infinite ease-in-out;
    }

    /* Blinking green dot */
    .blink-dot {
      animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }

    /* Reset button styles */
    .reset-btn {
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="relative flex flex-col items-center justify-between min-h-screen w-full bg-slate-950 overflow-hidden select-none px-6 py-12">

  <!-- ================= BACKGROUND: LIQUID BLOBS ================= -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <!-- Orbe 1: Cian / Azul -->
    <div class="absolute -top-16 -left-16 w-80 h-80 rounded-full animate-orb1"
         style="background: linear-gradient(to top right, rgba(6, 182, 212, 0.25), rgba(37, 99, 235, 0.35)); filter: blur(80px);"></div>

    <!-- Orbe 2: Naranja / Ámbar (Logística & Delivery) -->
    <div class="absolute top-1/3 -right-20 w-88 h-88 rounded-full animate-orb2"
         style="background: linear-gradient(to bottom left, rgba(245, 158, 11, 0.2), rgba(234, 88, 12, 0.25)); filter: blur(90px); animation-delay: 1s;"></div>

    <!-- Orbe 3: Violeta profundo -->
    <div class="absolute -bottom-20 left-10 w-96 h-96 rounded-full animate-orb3"
         style="background: linear-gradient(to top, rgba(124, 58, 237, 0.15), rgba(99, 102, 241, 0.15)); filter: blur(100px);"></div>
  </div>

  <!-- ================= HEADER / TOP BADGE ================= -->
  <div class="z-10 flex items-center gap-2 px-4 py-1.5 rounded-full glass-badge shadow-lg animate-header-in">
    <span class="relative flex h-2 w-2">
      <span class="blink-dot absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-400"></span>
    </span>
    <span class="text-xs font-medium tracking-wide text-gray-300">PWA Red Logística Activa</span>
  </div>

  <!-- ================= MAIN BRANDING & LIQUID GLASS CARD ================= -->
  <div class="z-10 flex flex-col items-center justify-center w-full max-w-sm">
    
    <!-- Tarjeta de Cristal Líquido -->
    <div class="relative p-7 rounded-3xl glass-card flex flex-col items-center animate-card-in w-full">
      <!-- Reflejo de luz en el borde superior -->
      <div class="absolute inset-x-8 top-0 h-[1px]" style="background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);"></div>

      <!-- Contenedor del Ícono Central con animación de ruta -->
      <div class="relative flex items-center justify-center w-28 h-28 rounded-2xl border border-white border-opacity-10 shadow-inner"
           style="background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(234, 88, 12, 0.08) 50%, transparent 100%);">
        
        <!-- Animación del vehículo -->
        <div class="animate-truck">
          <i data-lucide="truck" class="w-14 h-14 text-yellow-400" style="filter: drop-shadow(0 4px 12px rgba(251, 191, 36, 0.4));"></i>
        </div>

        <!-- Paquete flotante orbitando -->
        <div class="absolute top-4 right-3 p-2 rounded-xl border border-white border-opacity-20 shadow-md animate-package bg-slate-900 bg-opacity-80 backdrop-filter backdrop-blur-md"
             style="transform: translate(18px, -20px);">
          <i data-lucide="package" class="w-4 h-4 text-yellow-200"></i>
        </div>

        <!-- Punto de destino -->
        <div class="absolute -bottom-2 -left-2 p-1.5 rounded-lg border border-cyan-400 border-opacity-30 text-cyan-300 bg-cyan-500 bg-opacity-20 backdrop-filter backdrop-blur-md animate-pin">
          <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
        </div>
      </div>

      <!-- Nombre de la Marca -->
      <div class="mt-6 text-center animate-brand-in w-full">
        <h1 class="text-3xl font-extrabold tracking-tight text-white flex items-center justify-center gap-1.5">
          <span>Todo</span>
          <span class="text-transparent bg-clip-text" style="background-image: linear-gradient(to right, #fbbf24, #f97316, #fbbf24); -webkit-background-clip: text;">
            Delivery
          </span>
        </h1>
        <p class="text-xs tracking-wider uppercase text-gray-400 mt-1.5 font-medium">
          Tus envíos, en un solo lugar
        </p>
      </div>
    </div>
  </div>

  <!-- ================= BOTTOM: PROGRESS & FOOTER ================= -->
  <div class="z-10 w-full max-w-xs flex flex-col items-center gap-4">
    
    <!-- Barra de progreso Liquid Glass -->
    <div class="relative w-full h-2 rounded-full glass-bar overflow-hidden p-[1px]">
      <div id="progress-bar" class="h-full rounded-full" 
           style="width: 0%; background: linear-gradient(90deg, #f59e0b, #f97316, #22d3ee); box-shadow: 0 0 12px rgba(245, 158, 11, 0.6); transition: width 0.1s ease-out;">
      </div>
    </div>

    <!-- Indicador de porcentaje y estado -->
    <div class="w-full flex justify-between items-center text-[11px] font-medium text-gray-400 px-1">
      <span class="flex items-center gap-1">
        <i data-lucide="sparkles" class="w-3 h-3 text-yellow-400"></i>
        <span id="loading-status">Conectando servicios...</span>
      </span>
      <span id="progress-text" class="font-mono text-gray-300">0%</span>
    </div>
    
    <!-- Botón para reiniciar simulación en demo -->
    <button id="reset-button" class="mt-4 px-3 py-1.5 text-xs rounded-lg text-gray-400 reset-btn hidden">
      Reiniciar Animación
    </button>
  </div>

  <!-- Script para correr la animación y simulación de carga -->
  <script>
    // Inicializar iconos de Lucide
    lucide.createIcons();

    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const loadingStatus = document.getElementById('loading-status');
    const resetButton = document.getElementById('reset-button');
    
    let progress = 0;
    let interval;

    const statuses = [
      { threshold: 0, text: "Conectando servicios..." },
      { threshold: 30, text: "Cargando bases de datos..." },
      { threshold: 60, text: "Estableciendo mapa en tiempo real..." },
      { threshold: 85, text: "Sincronizando pedidos..." },
      { threshold: 98, text: "¡Listo!" }
    ];

    function updateStatus(val) {
      // Obtener el estado más actual para el porcentaje actual
      const statusObj = [...statuses].reverse().find(s => val >= s.threshold);
      if (statusObj) {
        loadingStatus.innerText = statusObj.text;
      }
    }

    function startLoading() {
      progress = 0;
      progressBar.style.width = '0%';
      progressText.innerText = '0%';
      loadingStatus.innerText = "Conectando servicios...";
      resetButton.classList.add('hidden');
      
      clearInterval(interval);
      interval = setInterval(() => {
        progress += 1;
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
          
          // Mostrar botón de reinicio al terminar la demo
          setTimeout(() => {
            resetButton.classList.remove('hidden');
            loadingStatus.innerText = "Simulación completada";
          }, 800);
        }
        
        progressBar.style.width = progress + '%';
        progressText.innerText = progress + '%';
        updateStatus(progress);
      }, 30); // 3 segundos aprox. en total
    }

    // Iniciar carga al abrir
    window.addEventListener('DOMContentLoaded', () => {
      startLoading();
    });

    // Evento de reinicio
    resetButton.addEventListener('click', () => {
      startLoading();
    });
  </script>
</body>
</html>
