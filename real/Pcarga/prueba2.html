<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Todo Delivery</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Animación de orbes de fondo (Liquid Flow) */
    @keyframes float-slow {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.1); }
      66% { transform: translate(-25px, 20px) scale(0.95); }
    }

    @keyframes float-reverse {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(-35px, 35px) scale(1.15); }
      66% { transform: translate(25px, -20px) scale(0.9); }
    }

    .liquid-blob-1 {
      animation: float-slow 12s ease-in-out infinite;
    }

    .liquid-blob-2 {
      animation: float-reverse 15s ease-in-out infinite;
    }

    /* Efecto Liquid Glass puro */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        inset 0 -1px 0 rgba(255, 255, 255, 0.03);
    }

    .liquid-input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .liquid-input:focus {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(245, 158, 11, 0.5);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.15);
    }

    /* Líneas de cuadrícula sutiles */
    .grid-lines {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-[#090b10] text-slate-100 min-h-screen flex items-center justify-center p-4 overflow-hidden relative selection:bg-amber-500/30">

  <div class="absolute inset-0 grid-lines pointer-events-none"></div>

  <div class="absolute top-1/4 -left-20 w-80 h-80 rounded-full bg-gradient-to-tr from-amber-500/20 to-orange-600/10 blur-[90px] liquid-blob-1 pointer-events-none"></div>
  
  <div class="absolute -bottom-10 -right-20 w-96 h-96 rounded-full bg-gradient-to-tl from-sky-600/15 to-indigo-600/10 blur-[100px] liquid-blob-2 pointer-events-none"></div>

  <div class="absolute left-1/2 -translate-x-1/2 top-0 bottom-0 w-[1px] bg-gradient-to-b from-transparent via-white/[0.05] to-transparent pointer-events-none"></div>

  <main class="w-full max-w-[390px] z-10">
    <div id="main-card" class="liquid-glass rounded-3xl p-8 transition-all duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] relative overflow-hidden">
      
      <div class="absolute top-0 inset-x-12 h-[1px] bg-gradient-to-r from-transparent via-amber-400/30 to-transparent"></div>

      <div id="logo-container" class="flex flex-col items-center justify-center transition-all duration-700 ease-out">
        
        <div id="logo-wrapper" class="relative w-28 h-28 flex items-center justify-center transition-all duration-700">
          
          <div class="absolute inset-0 bg-amber-500/10 rounded-full blur-xl animate-pulse"></div>

          <img 
            id="app-logo"
            src="/LogoTD.png" 
            alt="Todo Delivery Logo" 
            class="relative z-10 w-full h-full object-contain filter drop-shadow-[0_8px_16px_rgba(0,0,0,0.4)] transition-all duration-700"
          />
        </div>

        <div id="brand-text" class="text-center mt-3 transition-all duration-500">
          <h1 class="text-xl font-bold tracking-tight text-white/90">Todo Delivery</h1>
          <p class="text-[11px] font-medium tracking-widest text-slate-400 uppercase mt-0.5">Envíos inteligentes</p>
        </div>
      </div>

      <div id="splash-view" class="mt-8 flex flex-col items-center transition-all duration-500">
        
        <div class="w-full bg-white/[0.04] h-[3px] rounded-full overflow-hidden relative">
          <div id="progress-bar" class="h-full w-0 bg-gradient-to-r from-amber-400 to-orange-500 rounded-full transition-all duration-100 ease-out"></div>
        </div>

        <div class="flex justify-between items-center w-full mt-3 text-[11px] text-slate-400 font-medium">
          <span class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
            Iniciando sistema...
          </span>
          <span id="progress-text" class="font-mono text-slate-300">0%</span>
        </div>
      </div>

      <div id="login-view" class="hidden opacity-0 translate-y-4 transition-all duration-700 ease-out mt-6">
        
        <form id="login-form" class="space-y-4" onsubmit="event.preventDefault();">
          
          <div class="space-y-1.5">
            <label class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold px-1">Usuario o Teléfono</label>
            <div class="relative flex items-center">
              <i data-lucide="phone" class="absolute left-3.5 w-4 h-4 text-slate-400"></i>
              <input 
                type="text" 
                placeholder="Ej. +54 9 11 1234 5678" 
                class="liquid-input w-full pl-10 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none"
                required
              />
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between px-1">
              <label class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Contraseña</label>
              <a href="#" class="text-[11px] text-amber-400/80 hover:text-amber-300 transition-colors">¿Olvidaste?</a>
            </div>
            <div class="relative flex items-center">
              <i data-lucide="lock" class="absolute left-3.5 w-4 h-4 text-slate-400"></i>
              <input 
                type="password" 
                placeholder="••••••••" 
                class="liquid-input w-full pl-10 pr-4 py-3 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none"
                required
              />
            </div>
          </div>

          <button 
            type="submit" 
            class="w-full mt-2 py-3.5 px-4 rounded-xl font-semibold text-sm text-slate-950 bg-gradient-to-r from-amber-400 via-amber-300 to-amber-500 hover:opacity-95 active:scale-[0.98] transition-all duration-200 shadow-[0_0_20px_rgba(245,158,11,0.25)] flex items-center justify-center gap-2"
          >
            <span>Iniciar Sesión</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

        <div class="relative my-5">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/[0.06]"></div></div>
          <div class="relative flex justify-center text-[10px] uppercase">
            <span class="bg-[#0f121a] px-2 text-slate-400">o regístrate</span>
          </div>
        </div>

        <button 
          type="button" 
          class="w-full py-2.5 rounded-xl text-xs font-medium text-slate-300 border border-white/[0.08] hover:bg-white/[0.03] transition-colors"
        >
          Crear una cuenta nueva
        </button>
      </div>

    </div>

    <div class="text-center mt-6 text-[10px] tracking-widest uppercase text-slate-400">
      Todo Delivery PWA • v1.0
    </div>
  </main>

  <script>
    // Inicializar iconos
    lucide.createIcons();

    // Elementos DOM
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const splashView = document.getElementById('splash-view');
    const loginView = document.getElementById('login-view');
    const logoWrapper = document.getElementById('logo-wrapper');
    const brandText = document.getElementById('brand-text');

    let currentProgress = 0;

    // Simulación de carga fluida
    const interval = setInterval(() => {
      currentProgress += Math.floor(Math.random() * 8) + 2;
      
      if (currentProgress >= 100) {
        currentProgress = 100;
        clearInterval(interval);
        progressBar.style.width = '100%';
        progressText.innerText = '100%';
        
        // Iniciar transición suave a Login
        setTimeout(revealLogin, 350);
      } else {
        progressBar.style.width = `${currentProgress}%`;
        progressText.innerText = `${currentProgress}%`;
      }
    }, 45);

    // Función que transforma el Splash en Login
    function revealLogin() {
      // 1. Ocultar la barra de carga desvaneciéndola
      splashView.classList.add('opacity-0', '-translate-y-2');
      
      setTimeout(() => {
        splashView.classList.add('hidden');

        // 2. Compactar el logo suavemente hacia arriba
        logoWrapper.classList.remove('w-28', 'h-28');
        logoWrapper.classList.add('w-16', 'h-16');
        
        brandText.classList.add('scale-95');

        // 3. Descubrir el formulario de Login
        loginView.classList.remove('hidden');
        
        // Forzar reflujo para activar transición CSS
        void loginView.offsetWidth;
        
        loginView.classList.remove('opacity-0', 'translate-y-4');
        loginView.classList.add('opacity-100', 'translate-y-0');
      }, 400);
    }
  </script>
</body>
</html>
