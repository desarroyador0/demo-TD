<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Todo Delivery</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Animación estándar de barra de carga sin carga en GPU */
    .progress-bar-fill {
      transition: width 0.15s ease-out;
    }

    /* Transición simple de opacidad */
    .view-transition {
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 select-none">

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="w-full max-w-sm mx-auto flex flex-col justify-center">

    <!-- ================= 1. PANTALLA DE CARGA (SPLASH) ================= -->
    <section id="splash-view" class="view-transition flex flex-col items-center justify-center text-center py-8">
      
      <!-- LOGO DEL CLIENTE (PNG sin fondo) -->
      <div class="w-24 h-24 mb-4 flex items-center justify-center">
        <img 
          id="app-logo"
          src="/LogoTD.png" 
          alt="Todo Delivery" 
          class="w-full h-full object-contain"
        />
      </div>

      <h1 class="text-2xl font-bold text-white tracking-tight">Todo Delivery</h1>
      <p class="text-xs text-slate-400 mt-1">Accediendo al sistema...</p>

      <!-- Barra de progreso minimalista -->
      <div class="w-48 mt-8">
        <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
          <div id="progress-bar" class="progress-bar-fill h-full w-0 bg-amber-500 rounded-full"></div>
        </div>
        <div class="flex justify-between items-center text-[11px] text-slate-500 mt-2 font-mono">
          <span id="status-text">Cargando...</span>
          <span id="percent-text">0%</span>
        </div>
      </div>
    </section>


    <!-- ================= 2. PANTALLA DE INICIO DE SESIÓN ================= -->
    <section id="login-view" class="view-transition hidden opacity-0 translate-y-2">
      
      <!-- Cabecera simple -->
      <div class="text-center mb-6">
        <div class="w-14 h-14 mx-auto mb-3 flex items-center justify-center">
          <img 
            src="/LogoTD.png" 
            alt="Todo Delivery" 
            class="w-full h-full object-contain"
          />
        </div>
        <h2 class="text-xl font-bold text-white tracking-tight">Iniciar Sesión</h2>
        <p class="text-xs text-slate-400 mt-1">Ingresa tus datos para continuar</p>
      </div>

      <!-- Formulario de Acceso -->
      <form id="login-form" class="space-y-4" onsubmit="event.preventDefault();">
        
        <!-- Campo Teléfono / Usuario -->
        <div class="space-y-1">
          <label for="user" class="block text-xs font-semibold text-slate-300">Teléfono o Usuario</label>
          <input 
            id="user"
            type="text" 
            inputmode="text"
            autocomplete="username"
            placeholder="Ej. +54 9 11 1234 5678" 
            class="w-full px-3.5 py-3 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
            required
          />
        </div>

        <!-- Campo Contraseña -->
        <div class="space-y-1">
          <div class="flex justify-between items-center">
            <label for="password" class="block text-xs font-semibold text-slate-300">Contraseña</label>
            <a href="#" class="text-xs text-amber-500 hover:underline">¿La olvidaste?</a>
          </div>
          <input 
            id="password"
            type="password" 
            autocomplete="current-password"
            placeholder="••••••••" 
            class="w-full px-3.5 py-3 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
            required
          />
        </div>

        <!-- Botón de Envío -->
        <button 
          type="submit" 
          class="w-full py-3 px-4 rounded-lg font-bold text-sm bg-amber-500 text-slate-950 active:bg-amber-600 transition-colors mt-2"
        >
          Entrar
        </button>
      </form>

      <!-- Divisor -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
        <div class="relative flex justify-center text-xs">
          <span class="bg-slate-950 px-3 text-slate-500">¿No tienes cuenta?</span>
        </div>
      </div>

      <!-- Botón de Registro Secundario -->
      <button 
        type="button" 
        class="w-full py-2.5 px-4 rounded-lg font-medium text-xs text-slate-300 bg-slate-900 border border-slate-800 active:bg-slate-800 transition-colors"
      >
        Crear nueva cuenta
      </button>

      <footer class="mt-8 text-center text-[11px] text-slate-600">
        Todo Delivery • PWA Ligera
      </footer>
    </section>

  </main>

  <!-- ================= 3. LÓGICA DE CONTROL SIMPLE ================= -->
  <script>
    const splashView = document.getElementById('splash-view');
    const loginView = document.getElementById('login-view');
    const progressBar = document.getElementById('progress-bar');
    const percentText = document.getElementById('percent-text');
    const statusText = document.getElementById('status-text');

    let currentProgress = 0;

    // Simulación de precarga rápida y liviana
    const loadTimer = setInterval(() => {
      currentProgress += 10;

      if (currentProgress >= 100) {
        currentProgress = 100;
        clearInterval(loadTimer);
        updateProgress(100, "Listo");
        setTimeout(showLogin, 180);
      } else {
        updateProgress(currentProgress, "Iniciando...");
      }
    }, 30);

    function updateProgress(value, status) {
      progressBar.style.width = `${value}%`;
      percentText.innerText = `${value}%`;
      statusText.innerText = status;
    }

    function showLogin() {
      // Ocultar pantalla de carga
      splashView.classList.add('opacity-0', '-translate-y-2');
      
      setTimeout(() => {
        splashView.classList.add('hidden');
        
        // Mostrar login inmediatamente
        loginView.classList.remove('hidden');
        
        // Forzar reflow mínimo para disparo de transición
        void loginView.offsetWidth;

        loginView.classList.remove('opacity-0', 'translate-y-2');
        loginView.classList.add('opacity-100', 'translate-y-0');
      }, 200);
    }
  </script>
</body>
</html>
